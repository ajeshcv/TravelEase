<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Your Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        .edit-profile-container {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .edit-profile-container h2 {
            text-align: center;
            font-size: 24px;
            color: #007bff;
            margin-bottom: 20px;
        }

        .edit-profile-container form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .edit-profile-container form label {
            font-weight: bold;
            color: #555;
        }

        .edit-profile-container form input[type="text"],
        .edit-profile-container form input[type="email"],
        .edit-profile-container form input[type="file"],
        .edit-profile-container form textarea,
        .edit-profile-container form select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            box-sizing: border-box;
        }

        .edit-profile-container form input:focus,
        .edit-profile-container form textarea:focus,
        .edit-profile-container form select:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .btn-one {
            background-color: #007bff;
            color: #fff;
            text-align: center;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-one:hover {
            background-color: #0056b3;
        }
        .home-link {
    display: block; 
    margin: 20px auto; 
    padding: 10px 20px;
    background-color: #00796b; 
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    transition: background-color 0.3s ease;
    text-align: center;
    font-size: 16px;
    width: fit-content; 
}

.home-link:hover {
    background-color: #00695c;
}
    </style>
</head>
<body>
    <div class="edit-profile-container">
        <h2>Edit Your Profile</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-one">Save Changes</button>
        </form>
    </div>
    <a href="{% url 'user_profile' %}" class="home-link">Go Back to Profile</a>
</body>
</html>
