{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Website</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'travel/images/touring.png' %}" />
</head>

<style>
    .faqs-container {
        width: 90%;
        max-width: 800px;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid #ced4da;
        border-radius: 8px;
        background-color: #f8f9fa;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    
    .faqs-container h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #343a40;
    }
    
    .faqs-container p {
        margin-bottom: 10px;
        line-height: 1.6; 
    }
    
    .faqs-container strong {
        font-weight: 500;
        color: #343a40;
    }
    
    .faqs-container em {
        color: #6c757d;
        font-style: italic;
    }
    
    .faqs-container hr {
        margin: 20px 0;
        border-top: 1px solid #dee2e6; 
    }
    
   
    .back-to-profile {
        display: block;
        margin: 20px auto;
        padding: 10px 20px;
        background-color: #00796b;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
        transition: background-color 0.3s ease;
        text-align: center;
        font-size: 16px;
        width: fit-content;
    }
    
    .back-to-profile:hover {
        background-color: #00695c;
    }
    
    </style>
    
    <div class="faqs-container">
        <h2>Your FAQs</h2>
        {% for faq in faqs %}
            <p><strong>Q:</strong> {{ faq.question }}</p>
            {% if faq.answer %}
                <p><strong>A:</strong> {{ faq.answer }}</p>
            {% else %}
                <p><em>Waiting for admin's reply...</em></p>
            {% endif %}
            <hr>
        {% endfor %}
    </div>
    
    <a href="{% url 'user_profile' %}" class="back-to-profile">Back to Profile</a>
