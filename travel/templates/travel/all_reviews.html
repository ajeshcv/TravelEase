{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Website</title>
    <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="{% static 'travel/images/touring.png' %}"

/>
</head>

<div class="reviews-section">
    <style>
        .reviews-section {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .reviews-section h2 {
            font-size: 48px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #333;
        }

        .reviews-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .review-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .review-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .profile-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .review-details h3 {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .review-date {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
        }

        .review-text {
            font-size: 16px;
            color: #555;
            margin-bottom: 10px;
            line-height: 1.5;
            text-align: center;
        }

        .review-rating {
            font-size: 14px;
            color: #00796b;
            font-weight: bold;
        }

        .btn-one {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #00796b;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .btn-one:hover {
            background-color: #004d40;
        }
    </style>

    <h2>REVIEWS</h2>
    <a href="{% if user.is_authenticated %}{% url 'write_review' %}{% else %}{% url 'login' %}?next={% url 'write_review' %}{% endif %}" class="btn-one">
        Write a Review
    </a>
    <a href="{% url 'home' %}" class="btn-one">Go Back to Home</a>
    
    <div class="reviews-list">
        {% for review in reviews %}
        <div class="review-card">
            <!-- Profile Image -->
            <img 
                src="{{ review.user.customer_profile.profile_image.url }}" 
                alt="{{ review.user.customer_profile.name }}" 
                class="profile-image"
                onerror="this.src='/static/images/default_profile.jpg'"
            >
            <div class="review-details">
                <h3>{{ review.user.customer_profile.name }}</h3>
                <p class="review-date">{{ review.created_at|date:"F j, Y" }}</p>
                <p class="review-text">{{ review.text }}</p>
                <p class="review-rating">Rating: {{ review.rating }} / 5</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
