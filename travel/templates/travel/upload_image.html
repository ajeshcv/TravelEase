{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Website</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'travel/images/touring.png' %}" />
</head>

<style>
    .upload-container {
    max-width: 600px;
    margin: 20px auto;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background-color: #f9f9f9;
    box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
}

.upload-container h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
}

.upload-container label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: #555; 
}

.upload-container input[type="file"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

.upload-container button[type="submit"] {
    background-color: #007bff; 
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.3s ease; 
}

.upload-container button[type="submit"]:hover {
    background-color: #0056b3; 
}


.errorlist {
    color: red;
    margin-top: 5px;
}
.home-link {
    display: block; 
    margin: 20px auto;
    padding: 10px 20px;
    background-color: #00796b;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    transition: background-color 0.3s ease;
    text-align: center;
    font-size: 16px;
    width: fit-content; 
}

.home-link:hover {
    background-color: #00695c;
}
</style>


<div class="upload-container">  {% comment %} Add the container div {% endcomment %}
    <h2>Upload Image</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload</button>
    </form>
</div> {% comment %} Close the container div {% endcomment %}
<a href="{% url 'user_profile' %}" class="home-link">Go Back to Profile</a>
